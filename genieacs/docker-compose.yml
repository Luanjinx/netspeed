version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: genieacs-mongodb
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - genieacs-net

  genieacs-cwmp:
    image: drumsergio/genieacs:latest
    container_name: genieacs-cwmp
    restart: always
    command: genieacs-cwmp
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://mongodb/genieacs
      - GENIEACS_CWMP_PORT=7547
      - GENIEACS_EXT_DIR=/opt/genieacs/ext
    ports:
      - "7547:7547"
    depends_on:
      - mongodb
    networks:
      - genieacs-net

  genieacs-nbi:
    image: drumsergio/genieacs:latest
    container_name: genieacs-nbi
    restart: always
    command: genieacs-nbi
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://mongodb/genieacs
      - GENIEACS_NBI_PORT=7557
    ports:
      - "7557:7557"
    depends_on:
      - mongodb
    networks:
      - genieacs-net

  genieacs-fs:
    image: drumsergio/genieacs:latest
    container_name: genieacs-fs
    restart: always
    command: genieacs-fs
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://mongodb/genieacs
      - GENIEACS_FS_PORT=7567
    ports:
      - "7567:7567"
    depends_on:
      - mongodb
    networks:
      - genieacs-net

  genieacs-ui:
    image: drumsergio/genieacs:latest
    container_name: genieacs-ui
    restart: always
    command: genieacs-ui
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://mongodb/genieacs
      - GENIEACS_UI_PORT=3000
      - GENIEACS_UI_HOST=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - genieacs-net

volumes:
  mongo-data:

networks:
  genieacs-net:
    driver: bridge
